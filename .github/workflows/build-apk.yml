name: Build and Release HY300 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure persistent debug keystore so updates never conflict
        run: |
          if [ -f "app/hy300-key.jks" ]; then
            mkdir -p ~/.android
            cp app/hy300-key.jks ~/.android/debug.keystore
          fi

      - name: Build APK with Gradle
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          curl -sL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.4/bin/gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk hy300-ultralight.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hy300-ultralight-apk
          path: hy300-ultralight.apk

      - name: Publish to GitHub Releases (OTA Update)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "HY300 UltraLight v1.0.${{ github.run_number }}"
          files: hy300-ultralight.apk
          draft: false
          prerelease: false