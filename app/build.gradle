plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def otaKeystorePath = System.getenv("HY300_SIGNING_KEYSTORE")
def otaStorePassword = System.getenv("HY300_SIGNING_STORE_PASSWORD")
def otaKeyAlias = System.getenv("HY300_SIGNING_KEY_ALIAS")
def otaKeyPassword = System.getenv("HY300_SIGNING_KEY_PASSWORD")

android {
    namespace 'dev.tvspecialist.hy300light'
    compileSdk 33

    defaultConfig {
        applicationId "dev.tvspecialist.hy300light"
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName "1.1-ultralight"
    }

    buildTypes {
        debug {
            if (otaKeystorePath) {
                signingConfig signingConfigs.create("ota") {
                    storeFile file(otaKeystorePath)
                    storePassword otaStorePassword
                    keyAlias otaKeyAlias
                    keyPassword otaKeyPassword
                }
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core:1.10.1'
}
