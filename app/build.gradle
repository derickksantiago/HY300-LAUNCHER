plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.tvspecialist.hy300light'
    compileSdk 33

    defaultConfig {
        applicationId "dev.tvspecialist.hy300light"
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName "1.1-ultralight"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core:1.10.1'
}
